name: Release and Publish to npm

# Tag-driven auto-release using npm trusted publishing (OIDC) — no NPM_TOKEN.
#
# Push a SemVer tag that matches package.json, e.g.:
#
#   git tag v2.6.0 && git push origin v2.6.0
#
# That single tag push runs tests + build, publishes to npm via the configured
# trusted publisher (with automatic provenance), and creates the GitHub Release
# with auto-generated notes.
#
# Prerequisites:
#   - npm: package > Settings > Trusted Publisher configured for this repo and
#     workflow file (.github/workflows/publish.yml).
#   - The job needs `id-token: write` so npm can mint a short-lived OIDC token.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # v2.6.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # pre-releases, e.g. v2.6.0-rc.1

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so release notes can be generated

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG packageVersion=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json (and package-lock) before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Trusted publishing: authentication is via OIDC (no token), and provenance
      # attestations are generated automatically.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG
